# Cloud Deploy pipeline for tx-flow-visualizer.
# Apply with:
#   gcloud deploy apply --file=clouddeploy.yaml --region=europe-west2 --project=etherlink-infra-prod-7b74

apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: tx-flow-visualizer
  location: europe-west2
description: Deploy tx-flow-visualizer to Cloud Run with manual approval for prod
serialPipeline:
  stages:
  - targetId: prod
    profiles: [prod]
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
  location: europe-west2
requireApproval: true
run:
  location: projects/etherlink-infra-prod-7b74/locations/europe-west2
