version: "3.9"

services:
  # Single container: serves the React frontend and the WebSocket fan-out
  # proxy from one Node.js process.  The private EVM node URL is never
  # exposed to browsers.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Set TEZOS_WS_URL in a .env file or via your deployment platform.
      # Do NOT commit the real value.
      TEZOS_WS_URL: ${TEZOS_WS_URL}
      # Optional: restrict which browser origins may connect.
      # ALLOWED_ORIGINS: "https://stream.proofofspeed.xyz"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
